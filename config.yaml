# ==============================================================================
# LiteLLM Proxy config — Claude Code + Amazon Bedrock
# ==============================================================================
# ⚠️ Note: this file is base64-embedded into the TaskDef of template.yaml for
#    AWS deploys. Edit + run `make deploy` to apply changes in production.
#
#    Local dev (docker-compose) mounts this file directly via volume.
# ==============================================================================

model_list:
  # ==========================================
  # Primary: Amazon Bedrock (Invoke mode)
  # ==========================================

  # Claude Sonnet 4.6 — daily driver (best price/perf)
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-sonnet-4-6
      aws_region_name: us-west-2

  # Claude Opus 4.7 — heavy reasoning
  - model_name: claude-opus-4-7
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-opus-4-7
      aws_region_name: us-west-2

  # Claude Opus 4.8 — latest flagship reasoning model
  - model_name: claude-opus-4-8
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-opus-4-8
      aws_region_name: us-west-2

  # Claude Haiku 4.5 — sub-agents / reads / classification (cheapest)
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-west-2

  # ==========================================
  # Fallback: direct Anthropic API (used when Bedrock throttles)
  # ==========================================
  - model_name: claude-sonnet-4-6-fallback
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5-fallback
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

# ==============================================================================
# LiteLLM core settings
# ==============================================================================
litellm_settings:
  # API auth
  master_key: os.environ/LITELLM_MASTER_KEY

  # Prompt Caching (shared across instances via Redis)
  cache: true
  cache_params:
    type: "redis"
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 300

  # Cost tracking / observability callbacks (off by default)
  # To enable Langfuse:
  #   1. set LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY env vars
  #   2. uncomment the line below
  # success_callback: ["langfuse"]

  set_verbose: false

# ==============================================================================
# Routing
# ==============================================================================
router_settings:
  # Routing strategies:
  #   - "simple-shuffle": random
  #   - "least-busy": fewest in-flight requests (default)
  #   - "latency-based-routing": lowest latency
  #   - "cost-based-routing": lowest cost
  routing_strategy: "least-busy"

  # Retries and timeouts
  num_retries: 3
  timeout: 120
  retry_after: 5

  # Fallbacks: route to Anthropic API when Bedrock fails
  fallbacks:
    - claude-sonnet-4-6: ["claude-sonnet-4-6-fallback"]
    - claude-haiku-4-5-20251001: ["claude-haiku-4-5-fallback"]
    - claude-opus-4-8: ["claude-opus-4-7"]   # Opus 4.8 throttle → fall back to 4.7

  # Rate limits (uncomment as needed)
  # model_group_max_rpm:
  #   claude-sonnet-4-6: 100
  #   claude-opus-4-7: 20
  #   claude-haiku-4-5-20251001: 200

# ==============================================================================
# Global budget + database
# ==============================================================================
general_settings:
  # Global monthly budget (USD)
  max_budget: 2000
  budget_duration: "monthly"

  # Database (persists Virtual Keys / Spend / UI config)
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # UI access scope
  # ui_access_mode: "all"  # or "admin_only"
