# ==============================================================================
# LiteLLM Proxy 配置 — Claude Code + Amazon Bedrock
# ==============================================================================
# ⚠️ 注意：AWS 部署时此文件已 base64 内嵌进 template.yaml 的 TaskDef，
#    修改后需 `make deploy` 才会生效。
#
#    本地开发（docker-compose）会通过 volume 挂载此文件到容器。
# ==============================================================================

model_list:
  # ==========================================
  # Primary: Amazon Bedrock (Invoke 模式)
  # ==========================================

  # Claude Sonnet 4.6 — 日常主力（最佳性价比）
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-sonnet-4-6
      aws_region_name: us-west-2

  # Claude Opus 4.7 — 复杂推理任务
  - model_name: claude-opus-4-7
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-opus-4-7
      aws_region_name: us-west-2

  # Claude Haiku 4.5 — 子代理 / 读取 / 分类（最便宜）
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-west-2

  # ==========================================
  # Fallback: Anthropic API 直连（Bedrock 限流时自动切换）
  # ==========================================
  - model_name: claude-sonnet-4-6-fallback
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5-fallback
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

# ==============================================================================
# LiteLLM 核心设置
# ==============================================================================
litellm_settings:
  # API 认证
  master_key: os.environ/LITELLM_MASTER_KEY

  # Prompt Caching（跨实例共享 — 通过 Redis）
  cache: true
  cache_params:
    type: "redis"
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 300

  # 成本追踪 / 可观测性回调（默认关闭）
  # 如需接入 Langfuse：
  #   1. 设置 LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY 环境变量
  #   2. 取消下面一行注释
  # success_callback: ["langfuse"]

  set_verbose: false

# ==============================================================================
# 路由策略
# ==============================================================================
router_settings:
  # 路由策略:
  #   - "simple-shuffle": 随机
  #   - "least-busy": 最少请求数（默认）
  #   - "latency-based-routing": 最低延迟
  #   - "cost-based-routing": 最低成本
  routing_strategy: "least-busy"

  # 重试与超时
  num_retries: 3
  timeout: 120
  retry_after: 5

  # Fallback：Bedrock 故障时切 Anthropic API
  fallbacks:
    - claude-sonnet-4-6: ["claude-sonnet-4-6-fallback"]
    - claude-haiku-4-5-20251001: ["claude-haiku-4-5-fallback"]

  # 速率限制（按需取消注释）
  # model_group_max_rpm:
  #   claude-sonnet-4-6: 100
  #   claude-opus-4-7: 20
  #   claude-haiku-4-5-20251001: 200

# ==============================================================================
# 全局预算管控 + 数据库
# ==============================================================================
general_settings:
  # 全局月度预算上限（美元）
  max_budget: 2000
  budget_duration: "monthly"

  # 数据库（持久化 Virtual Keys / Spend / UI 配置）
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # UI 访问范围
  # ui_access_mode: "all"  # 或 "admin_only"
