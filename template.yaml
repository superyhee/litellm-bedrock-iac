AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LiteLLM Proxy for Claude Code + Amazon Bedrock — single-shot deploy.
  CloudFront -> VPC Origin -> Internal ALB -> ECS Fargate -> Bedrock + RDS PostgreSQL.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

  DBPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: (Optional) PostgreSQL master password. Leave empty to let CFN auto-generate one in Secrets Manager

  LiteLLMMasterKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: (Optional) LiteLLM master API key. Leave empty to let CFN auto-generate a random string in Secrets Manager

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: (Optional) Anthropic API key for fallback routing

  LiteLLMLicenseKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: (Optional) LiteLLM Enterprise License Key. Empty = open-source build (UI already supports model/Key/Team/Spend management). Provide a license to enable Enterprise (SSO / Audit / Custom branding)

  DesiredCount:
    Type: Number
    Default: 2
    Description: Number of ECS tasks

  MaxCount:
    Type: Number
    Default: 10
    Description: Max ECS tasks for auto-scaling

  ContainerCpu:
    Type: Number
    Default: 1024
    Description: CPU units (256=0.25 vCPU, 512=0.5, 1024=1, 2048=2)

  ContainerMemory:
    Type: Number
    Default: 2048
    Description: Memory in MB

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues:
      - PriceClass_100   # NA + Europe + Israel only (cheapest)
      - PriceClass_200   # + Asia Pacific (JP/SG/KR/HK/TW/IN/TH) + Middle East + Africa
      - PriceClass_All   # Global (+ Australia/NZ/Indonesia/South America)
    Description: CloudFront edge node coverage. For users mainly in Asia Pacific use PriceClass_200 or PriceClass_All

Conditions:
  AutoGenerateDBPassword: !Equals [!Ref DBPassword, '']
  AutoGenerateMasterKey: !Equals [!Ref LiteLLMMasterKey, '']

Resources:
  # ========== Auto-generated DB password (when DBPassword parameter is empty) ==========
  AutoDBPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: AutoGenerateDBPassword
    Properties:
      Name: !Sub ${AWS::StackName}/db-password-auto
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
        IncludeSpace: false

  # ========== Auto-generated Master Key (when LiteLLMMasterKey parameter is empty) ==========
  AutoMasterKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: AutoGenerateMasterKey
    Properties:
      Name: !Sub ${AWS::StackName}/master-key-auto
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
        IncludeSpace: false
  # ========== VPC ==========
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ========== Security Groups ==========
  # ALB SG starts with no ingress; SecurityGroupIngressFromCfSg is added after VpcOrigin is created (the SG ID is discovered via the Lambda CustomResource).
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB Security Group (CloudFront VPC Origin only)
      VpcId: !Ref VPC

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Tasks Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - only from ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis - only from ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # ========== ALB ==========
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /health/liveliness
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Port: 4000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ========== RDS PostgreSQL ==========
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: LiteLLM RDS subnet group (private)
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-db
      Engine: postgres
      EngineVersion: '16.14'
      DBInstanceClass: db.t4g.small
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: litellm
      MasterUsername: litellm
      MasterUserPassword: !If
        - AutoGenerateDBPassword
        - !Sub '{{resolve:secretsmanager:${AutoDBPasswordSecret}:SecretString}}'
        - !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true

  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/database-url
      SecretString: !If
        - AutoGenerateDBPassword
        - !Sub 'postgresql://litellm:{{resolve:secretsmanager:${AutoDBPasswordSecret}:SecretString}}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/litellm'
        - !Sub 'postgresql://litellm:${DBPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/litellm'

  # ========== ElastiCache Redis (shared Prompt Cache across LiteLLM tasks) ==========
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: LiteLLM Redis subnet group (private)
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}-redis
      CacheNodeType: cache.t4g.micro
      Engine: redis
      NumCacheNodes: 1
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      AutoMinorVersionUpgrade: true

  # ========== ECS ==========
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ListInferenceProfiles
                Resource:
                  - 'arn:aws:bedrock:*:*:inference-profile/*'
                  - 'arn:aws:bedrock:*:*:application-inference-profile/*'
                  - 'arn:aws:bedrock:*:*:foundation-model/*'

  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/*

  ApiKeysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/litellm-keys
      SecretString: !If
        - AutoGenerateMasterKey
        - !Sub |
          {
            "LITELLM_MASTER_KEY": "{{resolve:secretsmanager:${AutoMasterKeySecret}:SecretString}}",
            "ANTHROPIC_API_KEY": "${AnthropicApiKey}",
            "LITELLM_LICENSE": "${LiteLLMLicenseKey}"
          }
        - !Sub |
          {
            "LITELLM_MASTER_KEY": "${LiteLLMMasterKey}",
            "ANTHROPIC_API_KEY": "${AnthropicApiKey}",
            "LITELLM_LICENSE": "${LiteLLMLicenseKey}"
          }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-litellm
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: litellm
          Image: ghcr.io/berriai/litellm-database:main-latest
          PortMappings:
            - ContainerPort: 4000
          # Entrypoint: decode base64 config.yaml -> run `prisma db push` synchronously -> exec litellm.
          # The synchronous order prevents async prisma + uvicorn from contending for limited CPU/memory (which caused OOM/exit 137 in earlier iterations).
          EntryPoint: ['bash', '-c']
          Command:
            - |
              set -e
              echo "[INIT] Decoding config.yaml from CONFIG_YAML_BASE64..."
              echo "$CONFIG_YAML_BASE64" | base64 -d > /app/config.yaml
              echo "[INIT] Running prisma db push..."
              cd /app && prisma db push --schema /app/schema.prisma --accept-data-loss --skip-generate
              echo "[INIT] Prisma done. Starting litellm..."
              exec litellm --config /app/config.yaml --port 4000 --host 0.0.0.0
          Secrets:
            - Name: LITELLM_MASTER_KEY
              ValueFrom: !Sub '${ApiKeysSecret}:LITELLM_MASTER_KEY::'
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Sub '${ApiKeysSecret}:ANTHROPIC_API_KEY::'
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecret
            - Name: UI_PASSWORD
              ValueFrom: !Sub '${ApiKeysSecret}:LITELLM_MASTER_KEY::'
            - Name: LITELLM_LICENSE
              ValueFrom: !Sub '${ApiKeysSecret}:LITELLM_LICENSE::'
          Environment:
            - Name: PORT
              Value: '4000'
            - Name: UI_USERNAME
              Value: admin
            - Name: REDIS_HOST
              Value: !GetAtt RedisCluster.RedisEndpoint.Address
            - Name: REDIS_PORT
              Value: !GetAtt RedisCluster.RedisEndpoint.Port
            - Name: CONFIG_YAML_BASE64
              # config.yaml embedded as base64 — CFN renders this at deploy time, the entrypoint decodes it to /app/config.yaml
              # Changes to config.yaml require `make deploy` to take effect
              Value: !Base64 |
                # ==============================================================================
                # LiteLLM Proxy Configuration for Claude Code + Amazon Bedrock
                # ==============================================================================

                model_list:
                  # ==========================================
                  # Primary: Amazon Bedrock (Invoke mode)
                  # ==========================================

                  # Claude Sonnet 4.6 — daily driver (best price/perf)
                  - model_name: claude-sonnet-4-6
                    litellm_params:
                      model: bedrock/invoke/us.anthropic.claude-sonnet-4-6
                      aws_region_name: us-west-2

                  # Claude Opus 4.7 — heavy reasoning
                  - model_name: claude-opus-4-7
                    litellm_params:
                      model: bedrock/invoke/us.anthropic.claude-opus-4-7
                      aws_region_name: us-west-2

                  # Claude Haiku 4.5 — sub-agents / reads / classification (cheapest)
                  - model_name: claude-haiku-4-5-20251001
                    litellm_params:
                      model: bedrock/invoke/us.anthropic.claude-haiku-4-5-20251001-v1:0
                      aws_region_name: us-west-2

                  # ==========================================
                  # Fallback: direct Anthropic API (used when Bedrock throttles)
                  # ==========================================
                  - model_name: claude-sonnet-4-6-fallback
                    litellm_params:
                      model: anthropic/claude-sonnet-4-6
                      api_key: os.environ/ANTHROPIC_API_KEY

                  - model_name: claude-haiku-4-5-fallback
                    litellm_params:
                      model: anthropic/claude-haiku-4-5-20251001
                      api_key: os.environ/ANTHROPIC_API_KEY

                # ==============================================================================
                # LiteLLM core settings
                # ==============================================================================
                litellm_settings:
                  master_key: os.environ/LITELLM_MASTER_KEY
                  cache: true
                  cache_params:
                    type: "redis"
                    host: os.environ/REDIS_HOST
                    port: os.environ/REDIS_PORT
                    ttl: 300
                  set_verbose: false

                # ==============================================================================
                # Routing
                # ==============================================================================
                router_settings:
                  routing_strategy: "least-busy"
                  num_retries: 3
                  timeout: 120
                  retry_after: 5
                  fallbacks:
                    - claude-sonnet-4-6: ["claude-sonnet-4-6-fallback"]
                    - claude-haiku-4-5-20251001: ["claude-haiku-4-5-fallback"]

                # ==============================================================================
                # Global budget + database
                # ==============================================================================
                general_settings:
                  max_budget: 2000
                  budget_duration: "monthly"
                  database_url: os.environ/DATABASE_URL
                  store_model_in_db: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: litellm

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 300
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: false
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: litellm
          ContainerPort: 4000
          TargetGroupArn: !Ref ALBTargetGroup

  # ========== Auto Scaling ==========
  ScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxCount
      MinCapacity: !Ref DesiredCount
      ResourceId: !Sub service/${ECSCluster}/${ECSService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ========== CloudFront VPC Origin ==========
  # Connect to the internal ALB through VPC Origin (no public ALB exposure).
  CloudFrontVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub ${AWS::StackName}-vpc-origin
        Arn: !Ref ApplicationLoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols:
          - TLSv1.2

  # ========== Lambda for SG bootstrap ==========
  # AWS auto-creates CloudFront-VPCOrigins-Service-SG in the VPC when VpcOrigin is created.
  # A Lambda CustomResource looks up its ID so we can add it to the ALB SG ingress.
  SgLookupLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeSGs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: '*'

  SgLookupLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt SgLookupLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3, time, urllib.request, json
          def cfn_send(event, status, data, reason=''):
              body = json.dumps({
                  'Status': status, 'Reason': reason or 'OK',
                  'PhysicalResourceId': event.get('PhysicalResourceId') or event['LogicalResourceId'],
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'], 'Data': data
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                                           headers={'Content-Type': ''})
              urllib.request.urlopen(req).read()
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      return cfn_send(event, 'SUCCESS', {})
                  vpc = event['ResourceProperties']['VpcId']
                  name = event['ResourceProperties']['Name']
                  ec2 = boto3.client('ec2')
                  sg_id = None
                  for _ in range(30):
                      r = ec2.describe_security_groups(Filters=[
                          {'Name': 'vpc-id', 'Values': [vpc]},
                          {'Name': 'group-name', 'Values': [name]}
                      ])
                      if r['SecurityGroups']:
                          sg_id = r['SecurityGroups'][0]['GroupId']; break
                      time.sleep(10)
                  if not sg_id:
                      return cfn_send(event, 'FAILED', {}, f'SG {name} not found in {vpc} after 5min')
                  cfn_send(event, 'SUCCESS', {'SecurityGroupId': sg_id})
              except Exception as e:
                  cfn_send(event, 'FAILED', {}, str(e)[:300])

  CloudFrontVpcOriginSgLookup:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: CloudFrontVpcOrigin
    Properties:
      ServiceToken: !GetAtt SgLookupLambda.Arn
      VpcId: !Ref VPC
      Name: CloudFront-VPCOrigins-Service-SG

  # Allow traffic only from the CloudFront VPC Origin service-managed SG
  ALBSecurityGroupIngressFromCfSg:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !GetAtt CloudFrontVpcOriginSgLookup.SecurityGroupId

  # ========== CloudFront Distribution ==========
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: ALBSecurityGroupIngressFromCfSg
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            Id: ALBOrigin
            VpcOriginConfig:
              VpcOriginId: !GetAtt CloudFrontVpcOrigin.Id
              OriginKeepaliveTimeout: 5
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        PriceClass: !Ref CloudFrontPriceClass

  # ========== CloudWatch Alarms ==========
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-high-cpu
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSCluster
        - Name: ServiceName
          Value: !GetAtt ECSService.Name

Outputs:
  LiteLLMMasterKey:
    Description: LiteLLM master API key (use as ANTHROPIC_AUTH_TOKEN / UI password)
    Value: !If
      - AutoGenerateMasterKey
      - !Sub '{{resolve:secretsmanager:${AutoMasterKeySecret}:SecretString}}'
      - !Ref LiteLLMMasterKey

  DBPassword:
    Description: PostgreSQL master password (database = litellm, user = litellm)
    Value: !If
      - AutoGenerateDBPassword
      - !Sub '{{resolve:secretsmanager:${AutoDBPasswordSecret}:SecretString}}'
      - !Ref DBPassword

  CloudFrontURL:
    Description: LiteLLM Proxy URL (set as ANTHROPIC_BASE_URL)
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  UILoginURL:
    Description: LiteLLM Admin UI
    Value: !Sub https://${CloudFrontDistribution.DomainName}/ui/

  UICredentials:
    Description: UI login credentials
    Value: 'username=admin / password=<LiteLLMMasterKey value you provided>'

  ALBUrl:
    Description: Internal ALB DNS (not publicly accessible)
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}

  ClaudeCodeConfig:
    Description: Claude Code configuration commands
    Value: !Sub |
      export ANTHROPIC_BASE_URL=https://${CloudFrontDistribution.DomainName}
      export ANTHROPIC_AUTH_TOKEN=<your-litellm-master-key>
      export CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=1
      claude --model claude-sonnet-4-6
